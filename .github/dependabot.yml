version: 2

updates:
  # Phase 2 Python dependency (verify/requirements.txt).
  - package-ecosystem: "pip"
    directory: "/verify"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used by any workflow added later. Harmless no-op until then.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
