version: 2

updates:
  # Phase 2 Python dependency (verify/requirements.txt).
  - package-ecosystem: "pip"
    directory: "/verify"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Test-only DOM runtime for the report interaction suite.
  - package-ecosystem: "npm"
    directory: "/tests/report-ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(test-deps)"

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
